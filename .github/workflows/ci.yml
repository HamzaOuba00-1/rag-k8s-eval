name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # Light install: the tests never load a model, so neither PyTorch nor
      # sentence-transformers (and no model download) is needed here.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -e .
          pip install "numpy>=1.26,<3" "python-frontmatter>=1.1,<2" "rank-bm25==0.2.2" "faiss-cpu>=1.8,<2" \
            "tqdm>=4.66" "openpyxl>=3.1,<4" "httpx>=0.27,<1" "matplotlib>=3.8,<4" \
            "onnx>=1.17" "onnxruntime>=1.20" "tokenizers>=0.20" \
            "pytest>=8" "ruff>=0.6" "mypy>=1.11"
      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest

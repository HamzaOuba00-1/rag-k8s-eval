[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragk8s"
version = "0.2.0"
description = "RAG over the Kubernetes documentation with a measurement-first evaluation (RAGAS, retrieval metrics, bootstrap CIs)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Hamza Ouba" }]
dependencies = [
    "numpy>=1.26,<3",
    "python-frontmatter>=1.1,<2",
    "rank-bm25==0.2.2",
    "faiss-cpu>=1.8,<2",
    "sentence-transformers>=3.0,<7",
    "ollama>=0.4,<1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
ragk8s = "ragk8s.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ragk8s = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src/ragk8s", "tests"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["faiss", "rank_bm25", "frontmatter", "ollama", "sentence_transformers", "sentence_transformers.*", "tqdm"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

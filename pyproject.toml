[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ragk8s"
version = "0.2.0"
description = "RAG over the Kubernetes documentation with a measurement-first evaluation (RAGAS, retrieval metrics, bootstrap CIs)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Hamza Ouba" }]
dependencies = [
    "numpy>=1.26,<3",
    "python-frontmatter>=1.1,<2",
    "rank-bm25==0.2.2",
    "faiss-cpu>=1.8,<2",
    "sentence-transformers>=3.0,<7",
    "ollama>=0.4,<1",
    "tqdm>=4.66",
    "openpyxl>=3.1,<4",
    "httpx>=0.27,<1",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

# Judge dependencies, installed only in the Kaggle judge notebook (pinned: ragas 0.4.3
# imports a module removed in langchain-community 0.4.2).
judge = [
    "ragas==0.4.3",
    "langchain-community==0.4.1",
    "openai>=1.40,<3",
]

# ONNX export (development PC) and ONNX serving (web app, no PyTorch needed).
onnx = [
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.3",
    "tokenizers>=0.20",
]

[project.scripts]
ragk8s = "ragk8s.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ragk8s = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Markdown table rows are built as single f-strings.
"src/ragk8s/report.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/ragk8s", "tests"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["onnx", "onnx.*", "onnxruntime", "onnxruntime.*", "tokenizers", "tokenizers.*", "torch", "torch.*", "matplotlib", "matplotlib.*", "ragas", "ragas.*", "openai", "openai.*", "openpyxl", "openpyxl.*", "faiss", "rank_bm25", "frontmatter", "ollama", "sentence_transformers", "sentence_transformers.*", "tqdm"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
